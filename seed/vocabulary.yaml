# Tag vocabulary. Copied to ./pantrybase/vocabulary.yaml on first use; edit that copy.
#
# mode: closed  — only listed values are kept; unknown tags move to `other` (allergens are kept but flagged)
# mode: open    — new values are accepted and reported so the vocabulary can grow
# synonyms map card wording to one value; parent builds a hierarchy (filtering on a parent matches children).
# Values are kebab-case. Matching ignores case, accents and punctuation.

